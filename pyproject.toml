[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-policy-observatory"
version = "0.1.0"
description = "Source-auditable NYC policy and service implementation research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.13"]
brief = ["reportlab==4.4.9"]

[project.scripts]
nyc-observatory = "observatory.cli:main"

[tool.setuptools.packages.find]
include = ["observatory*"]
