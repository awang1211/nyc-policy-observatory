name: Validate project
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python -m observatory.cli init
      - run: python -m observatory.cli export --as-of 2026-10-27T00:00:00-04:00
      - run: python -m observatory.cli validate --as-of 2026-10-27T00:00:00-04:00
