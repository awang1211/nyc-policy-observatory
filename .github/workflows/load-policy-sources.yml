name: Load policy and context data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/load-policy-sources.yml
      - observatory/ingest.py

permissions:
  contents: read

concurrency:
  group: official-policy-sources
  cancel-in-progress: false

jobs:
  load-policy-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.NYC_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[postgres]'
      - name: Initialize evidence database
        run: python -m observatory.cli init
      - name: Load official ACS borough context
        id: acs
        continue-on-error: true
        run: python -m observatory.cli ingest-acs
      - name: Find accessible official NYC Open Data sources
        id: open_data_catalog
        run: python -m observatory.cli discover-open-data
      - name: Inspect selected official data fields
        id: open_data_schemas
        run: python -m observatory.cli inspect-open-data
      - name: Load selected official Council and performance data
        id: selected_open_data
        run: python -m observatory.cli ingest-open-data
      - name: Confirm selected datasets contain real records
        id: verified_open_data
        run: python -m observatory.cli verify-open-data
      - name: Discover official NYC agency publications
        id: agency_publications
        continue-on-error: true
        run: python -m observatory.cli discover-news --max-pages 500
      - name: Discover official Council introductions
        id: council_introductions
        continue-on-error: true
        run: python -m observatory.cli discover-policies
      - name: Discover official Council events
        id: council_events
        continue-on-error: true
        run: python -m observatory.cli discover-events
      - name: Publish source artifacts and policy candidates to Neon
        run: python -m observatory.cli load-postgres-sources
      - name: Summarize official source coverage
        if: always()
        run: |
          {
            echo "## Official policy source coverage"
            echo ""
            echo "- ACS: ${{ steps.acs.outcome }}"
            echo "- NYC Open Data source search: ${{ steps.open_data_catalog.outcome }}"
            echo "- Selected official data fields: ${{ steps.open_data_schemas.outcome }}"
            echo "- Selected Council and performance data: ${{ steps.selected_open_data.outcome }}"
            echo "- Non-empty Council and performance records: ${{ steps.verified_open_data.outcome }}"
            echo "- NYC agency publications: ${{ steps.agency_publications.outcome }}"
            echo "- Council introductions: ${{ steps.council_introductions.outcome }}"
            echo "- Council events: ${{ steps.council_events.outcome }}"
            echo "- Discovered publications remain review candidates and are not implementation findings."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve accessible source catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-open-data-catalog
          path: |
            reports/open-data-catalog.json
            reports/open-data-schemas.json
          if-no-files-found: warn
          retention-days: 30
